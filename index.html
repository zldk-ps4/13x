<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Jailbreak Host</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 6px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 4px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { text-align:center; padding:8px 10px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  #brand img { width:28px; height:28px; margin-right:8px; border-radius:50%;
               vertical-align:middle; }
  #brand b { font-size:15px; font-weight:700; letter-spacing:.14em;
             color:#e6ebf2; vertical-align:middle; }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body class="landing">

<div class="g2all-center">
  <button id="startJailbreakBtn" class="start-jailbreak-btn" type="button" disabled>Start Jailbreak</button>
  <div id="wrap" class="status-card">
    <div class="status-head">
      <div class="ready-state"><span class="ready-dot"></span><span>Ready</span></div>
      <div id="det" class="meta"></div>
    </div>
    <div id="state" class="g2all-msg">Detecting firmware...</div>
    <div id="cache"></div>
  </div>
  <div class="g2all-footer">Host by ZoLDiK</div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var startButton = document.getElementById("startJailbreakBtn");
    var startAction = null;
    var started = false;
    startButton.addEventListener("click", function () {
        if (started || startButton.disabled || !startAction) return;
        started = true;
        startButton.disabled = true;
        startButton.textContent = "Starting Jailbreak...";
        setState("Loading jailbreak... Please Wait", "warn");
        startAction();
    });
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = 'Detected Firmware: <span class="firmware-number">' + (key || "Unknown") + "</span>";

    var target = "jb.html" + location.search;
    function launch() { location.replace(target); }
    function go() { waitForTap("Ready — Press Start Jailbreak", launch); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        if (started) return;
        startAction = action === go ? launch : action;
        startButton.disabled = false;
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("Unsupported firmware — Press Start Jailbreak to try anyway", launch);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press Start Jailbreak to reload",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press Start Jailbreak", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press Start Jailbreak to reload",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press Start Jailbreak anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press Start Jailbreak", go);
        }, false);
    }
})();
</script>
</body>
</html>
